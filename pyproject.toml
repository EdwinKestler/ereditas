[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ereditas"
version = "0.1.0"
description = "Ereditas companion: liveness-gated digital estate for the Meta AI Hackathon"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openai>=2.0,<4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
ereditas-companion = "ereditas.companion:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["ereditas"]
omit = ["*/companion.py"]
